<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"easy-baked-spaghetti":"https://miaplates.com/easy-baked-spaghetti/","easy-cheesy-ground-beef-enchiladas":"https://miaplates.com/easy-cheesy-ground-beef-enchiladas/","easy-chinese-ground-beef-and-cabbage-stir-fry":"https://miaplates.com/easy-chinese-ground-beef-and-cabbage-stir-fry/","easy-cowboy-casserole-recipe":"https://miaplates.com/easy-cowboy-casserole-recipe/","easy-ground-beef-bulgogi":"https://miaplates.com/easy-ground-beef-bulgogi/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
